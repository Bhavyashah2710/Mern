<!DOCTYPE html>
<html>
<head>
  <style>
    html , body {
      width: 100%;
      height: 80%;
      text-align: center;
      font-family: sans-serif;
      background-color: #f0f0f0;
    }
    #gameBox {
      width: 100%;
      height: 100%;
      background-color: skyblue;
      position: relative;
      margin: 20px auto;
      overflow: hidden;
      border: 3px solid black;
    }
    #bhavya {
      width: 30px;
      height: 30px;
      background-color: red; 
      position: absolute;
      bottom: 20px;
      left: 30px;
      border: 1px solid black;
    }
    .jumpUp {
      animation: jump 1s ease-out;
    }
    @keyframes jump {
      0%   { bottom: 20px; }
      50%  { bottom: 90px; }
      100% { bottom: 20px; }
    }
    #ground {
      width: 100%;
      height: 20px;
      background-color: green;
      position: absolute;
      bottom: 0;
    }
    button {
      margin-top: 10px;
      padding: 10px 20px;
      font-size: 16px;
      background-color: black;
      color: yellow;
      border: 2px solid whitesmoke;
      cursor: pointer;
    }
  </style>
</head>
<body onclick="jumpMario(event)">
  <h1>Shah Mario Game!</h1>
  <p>Click anywhere on the screen to jump!</p>
  <div id="gameBox">
    <button id="startBtn" onclick="startGame(event)">START GAME</button>
    <div id="bhavya"></div>
    <div id="ground"></div>
  </div>
  <script>
    var mario = document.getElementById("bhavya");
    function startGame(event) {
      event.stopPropagation();
      alert("Game Started! Now click anywhere on the page to jump!");
    }
    function jumpMario(event) {
      if (event.target.tagName === 'BUTTON') return;
      if (!mario.classList.contains("jumpUp")) {
        mario.classList.add("jumpUp");
        setTimeout(function() {
          mario.classList.remove("jumpUp");
        }, 1000);
      }
    }
  </script>
</body>
</html>

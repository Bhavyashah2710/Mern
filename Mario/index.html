<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SharioX</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="gameBox">
    <div class="ui-container">
      <h1>Welcome to SharioX</h1>
      <p>Click anywhere or press Spacebar to jump!</p>
      <div id="scoreBoard">Score: <span id="scoreText">0</span></div>
      <button id="startBtn" onclick="startGame(event)">START GAME</button>
    </div>

    <img id="bhavyaImg" src="profile.jpg" alt="Player Image">
    <div id="obstacle"></div>
    <div id="ground"></div>

    <div id="gameOverModal" class="game-over-modal">
      <h2>Game Over!</h2>
      <p style="color: white; margin: 10px 0;">Final Score: <span id="finalScore">0</span></p>
      <button onclick="restartGame(event)">PLAY AGAIN</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>

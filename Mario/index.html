<!DOCTYPE html>
<html>
<head>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: sans-serif;
      user-select: none;
    }

    #gameBox {
      width: 100vw;
      height: 100vh;
      background-color: skyblue;
      position: relative;
    }

    .ui-container {
      position: absolute;
      top: 20px;
      width: 100%;
      text-align: center;
      z-index: 10;
    }

    h1 {
      color: white;
      text-shadow: 2px 2px 4px #000;
      margin-bottom: 5px;
    }

    p {
      color: #333;
      font-weight: bold;
    }

    button {
      margin-top: 10px;
      padding: 12px 24px;
      font-size: 18px;
      background-color: black;
      color: yellow;
      border: 2px solid whitesmoke;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    #bhavyaImg {
      width: 100px;
      height: 100px;
      position: absolute;
      bottom: 40px;
      left: 80px;
      object-fit: contain;
    }

    .jumpUp {
      animation: jump 1s ease-out;
    }

    @keyframes jump {
      0%   { bottom: 40px; }
      50%  { bottom: 220px; }
      100% { bottom: 40px; }
    }

    #ground {
      width: 100%;
      height: 40px;
      background-color: green;
      border-top: 4px solid darkgreen;
      position: absolute;
      bottom: 0;
    }
  </style>
</head>
<body>

  <div id="gameBox">
    <div class="ui-container">
      <h1>Wellcome to the SharioX</h1>
      <p>Click anywhere or press Spacebar to jump!</p>
      <button id="startBtn" onclick="startGame(event)">START GAME</button>
    </div>

    <img id="bhavyaImg" src="profile.jpg" alt="Player Image">

    <div id="ground"></div>
  </div>

  <script>
    var playerImg = document.getElementById("bhavyaImg");
    function startGame(event) {
      event.stopPropagation();
      alert("Game Started! Click anywhere or press Spacebar to jump!");
    }
    function jump() {
      if (!playerImg.classList.contains("jumpUp")) {
        playerImg.classList.add("jumpUp");
        setTimeout(function() {
          playerImg.classList.remove("jumpUp");
        }, 1000);
      }
    }
    window.addEventListener("click", function(event) {
      if (event.target.tagName === 'BUTTON') return;
      jump();
    });
    window.addEventListener("keydown", function(event) {
      if (event.code === "Space" || event.code === "ArrowUp" || event.code === "Enter") {
        jump();
      }
    });
  </script>
</body>
</html>
